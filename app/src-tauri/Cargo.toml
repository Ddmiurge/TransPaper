[package]
name = "paper-reader"
version = "0.1.0"
description = "论文阅读与管理（本地优先）"
authors = ["Ddmiurge"]
edition = "2021"
rust-version = "1.77"

# 薄壳阶段：只做窗口与文件能力，领域逻辑仍在前端（见 ADR-016）。
# 第二步换 SQLite 时再引入 rusqlite / keyring。
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Tauri 2 默认生成，保留以便后续启用 protocol 自定义
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
