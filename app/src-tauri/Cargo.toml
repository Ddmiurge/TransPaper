[package]
name = "paper-reader"
version = "0.1.0"
description = "论文阅读与管理（本地优先）"
authors = ["Ddmiurge"]
edition = "2021"
rust-version = "1.77"

# 薄壳阶段：只做窗口与文件能力，领域逻辑仍在前端（见 ADR-016）。
# 第二步换 SQLite 时再引入 rusqlite / keyring。
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 桌面翻译链路（I22）：LLM 请求由 Rust 发出 —— WebView 里的 fetch 过不了 CORS，
# 而 dev server 的代理在打包后不存在。native-tls 走系统 Security.framework。
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
# API Key 存系统钥匙串（兑现 ADR-011 §5 的安全欠账），不再落 localStorage
keyring = { version = "3", features = ["apple-native"] }

[features]
# Tauri 2 默认生成，保留以便后续启用 protocol 自定义
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
