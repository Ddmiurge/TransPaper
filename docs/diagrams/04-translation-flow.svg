<svg viewBox="0 0 680 364" width="680" height="364" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>一键翻译的调度数据流与段落状态机</title>
<desc>从用户触发到事件回流的六个阶段，以及 Segment 从 Pending 到 Done 或 Failed 的状态机与重试路径。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="364" fill="#FFFFFF"/>

<rect x="52" y="60" width="176" height="72" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="140" y="88" font-size="13" fill="#0C447C" text-anchor="middle" dominant-baseline="central">触发翻译</text>
<text x="140" y="106" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">一键 · 可见页优先</text>

<rect x="252" y="60" width="176" height="72" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="88" font-size="13" fill="#3C3489" text-anchor="middle" dominant-baseline="central">用例编排</text>
<text x="340" y="106" font-size="11" fill="#534AB7" text-anchor="middle" dominant-baseline="central">只取 translatable 段</text>

<rect x="452" y="60" width="176" height="72" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="540" y="88" font-size="13" fill="#085041" text-anchor="middle" dominant-baseline="central">调度器</text>
<text x="540" y="106" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">缓存命中 · 并发 · 退避</text>

<path d="M228 96 H250" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M428 96 H450" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M540 132 V152 H140 V170" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="52" y="172" width="176" height="72" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="140" y="200" font-size="13" fill="#633806" text-anchor="middle" dominant-baseline="central">Provider 适配</text>
<text x="140" y="218" font-size="11" fill="#854F0B" text-anchor="middle" dominant-baseline="central">段间上下文 + 术语表</text>

<rect x="252" y="172" width="176" height="72" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="200" font-size="13" fill="#633806" text-anchor="middle" dominant-baseline="central">流式落库</text>
<text x="340" y="218" font-size="11" fill="#854F0B" text-anchor="middle" dominant-baseline="central">分段写入 · 推进状态</text>

<rect x="452" y="172" width="176" height="72" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="540" y="200" font-size="13" fill="#0C447C" text-anchor="middle" dominant-baseline="central">事件回流</text>
<text x="540" y="218" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">对照视图增量插入</text>

<path d="M228 208 H250" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M428 208 H450" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="40" y="284" width="105" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="92" y="306" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">Pending</text>
<rect x="205" y="284" width="105" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="257" y="306" font-size="12" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Running</text>
<rect x="370" y="284" width="105" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="422" y="306" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central">Done</text>
<rect x="535" y="284" width="105" height="44" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="587" y="306" font-size="12" fill="#791F1F" text-anchor="middle" dominant-baseline="central">Failed</text>

<path d="M145 306 H203" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M310 306 H368" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M475 306 H533" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M587 328 V344 H92 V330" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<text x="340" y="340" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">重试</text>
</svg>
