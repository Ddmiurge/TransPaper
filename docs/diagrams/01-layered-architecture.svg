<text x="340" y="133" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">PDF 渲染 · 标注</text>

<rect x="438" y="96" width="173" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="524" y="115" font-size="13" fill="#0C447C" text-anchor="middle" dominant-baseline="central">双语对照视图</text>
<text x="524" y="133" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">原文段 + 译文段</text>

