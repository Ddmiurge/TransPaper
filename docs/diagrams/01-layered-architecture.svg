<svg viewBox="0 0 680 472" width="680" height="472" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>论文阅读软件的整体分层架构</title>
<desc>四层结构：表现层、应用层、领域层、基础设施层，以及每层包含的模块。层间依赖单向向上，领域层与基础设施层之间为依赖倒置。</desc>
