<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="472" fill="#FFFFFF"/>
<rect x="40" y="40" width="600" height="412" rx="20" fill="none" stroke="#D3D1C7" stroke-width="0.5"/>

<rect x="56" y="64" width="568" height="96" rx="12" fill="#F7F6F3" stroke="#D3D1C7" stroke-width="0.5"/>
