<svg viewBox="0 0 680 522" width="680" height="522" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>从 PDF 原始块到翻译单元的重建流程</title>
<desc>PDF 页面上的文本碎片经过段落重建聚合成 Segment，翻译后回填渲染，非文本块保持原位不翻译。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="522" fill="#FFFFFF"/>
<rect x="40" y="40" width="600" height="110" rx="12" fill="none" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="56" y="62" font-size="12" fill="#5F5E5A" dominant-baseline="central">PDF 页面上的原始块 · 排版驱动，语义破碎</text>

<rect x="56" y="76" width="133" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="122" y="96" font-size="13" fill="#0C447C" text-anchor="middle" dominant-baseline="central">文本块 #1</text>
<text x="122" y="114" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">粗体 · 14pt</text>

<rect x="201" y="76" width="133" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="267" y="96" font-size="13" fill="#0C447C" text-anchor="middle" dominant-baseline="central">文本块 #2</text>
<text x="267" y="114" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">常规 · 10pt</text>

<rect x="346" y="76" width="133" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="412" y="96" font-size="13" fill="#0C447C" text-anchor="middle" dominant-baseline="central">文本块 #3</text>
<text x="412" y="114" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">常规 · 10pt</text>

<rect x="491" y="76" width="133" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="557" y="96" font-size="13" fill="#444441" text-anchor="middle" dominant-baseline="central">图片块 #4</text>
<text x="557" y="114" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">无文本内容</text>

<path d="M340 151 V173" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="40" y="174" width="600" height="48" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="198" font-size="13" fill="#3C3489" text-anchor="middle" dominant-baseline="central">段落重建：阅读顺序 + 垂直间距 + 字号一致性聚类</text>

<path d="M340 223 V245" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="40" y="246" width="600" height="86" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="56" y="270" font-size="13" fill="#04342C" dominant-baseline="central">Segment #42 · 翻译单元</text>
<text x="56" y="292" font-size="12" fill="#0F6E56" dominant-baseline="central">sourceLang → targetLang · sourceHash 作为缓存键</text>
<text x="56" y="310" font-size="12" fill="#0F6E56" dominant-baseline="central">blockIds = [#1, #2, #3] · 相邻段可作为上下文</text>
<rect x="524" y="258" width="100" height="24" rx="6" fill="#FFFFFF" stroke="#0F6E56" stroke-width="0.5"/>
<text x="574" y="270" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">Pending</text>

<path d="M340 333 V353" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="40" y="354" width="600" height="148" rx="12" fill="none" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="56" y="376" font-size="12" fill="#5F5E5A" dominant-baseline="central">渲染回填：原文段下方注入译文，非文本块原位保留</text>

<rect x="56" y="390" width="356" height="40" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="234" y="410" font-size="12" fill="#444441" text-anchor="middle" dominant-baseline="central">原文段（由 #1 - #3 合成）</text>

<rect x="56" y="438" width="356" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="234" y="458" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central">译文段（注入到原文下方）</text>

<rect x="428" y="390" width="196" height="88" rx="8" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
<text x="526" y="424" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">图片 / 表格 / 代码块</text>
<text x="526" y="444" font-size="11" fill="#888780" text-anchor="middle" dominant-baseline="central">原位渲染，不翻译</text>
</svg>
