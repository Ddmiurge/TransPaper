<svg viewBox="0 0 680 376" width="680" height="376" role="img" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>SQLite 与文件系统的存储边界划分</title>
<desc>SQLite 承载元数据、解析产物、译文与全文索引；原始 PDF 和图片等大二进制走文件系统，数据库只保存哈希与路径。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="376" fill="#FFFFFF"/>
<rect x="40" y="40" width="320" height="222" rx="12" fill="#F7F6F3" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="56" y="62" font-size="12" fill="#085041" dominant-baseline="central">SQLite · library.db 单文件</text>

<rect x="56" y="78" width="288" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="72" y="96" font-size="12" fill="#085041" dominant-baseline="central">Paper / Collection / Tag 元数据</text>

<rect x="56" y="122" width="288" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="72" y="140" font-size="12" fill="#085041" dominant-baseline="central">Block 表 · 类型 · 坐标 · 阅读序</text>

<rect x="56" y="166" width="288" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="72" y="184" font-size="12" fill="#085041" dominant-baseline="central">Segment / Translation 译文表</text>

<rect x="56" y="210" width="288" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="72" y="228" font-size="12" fill="#085041" dominant-baseline="central">FTS5 全文索引</text>

<rect x="444" y="40" width="196" height="222" rx="12" fill="#F7F6F3" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="460" y="62" font-size="12" fill="#633806" dominant-baseline="central">文件系统 · AssetStore</text>

<rect x="460" y="78" width="164" height="36" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="476" y="96" font-size="12" fill="#633806" dominant-baseline="central">原始 PDF 文件</text>

<rect x="460" y="122" width="164" height="36" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="476" y="140" font-size="12" fill="#633806" dominant-baseline="central">页面缩略图</text>

<rect x="460" y="166" width="164" height="36" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="476" y="184" font-size="12" fill="#633806" dominant-baseline="central">图表裁剪图</text>

<rect x="460" y="210" width="164" height="36" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="476" y="228" font-size="12" fill="#633806" dominant-baseline="central">公式渲染缓存</text>

<path d="M360 151 H442" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<text x="401" y="136" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">只存哈希</text>

<rect x="40" y="290" width="600" height="66" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="312" font-size="13" fill="#3C3489" text-anchor="middle" dominant-baseline="central">架构约束 · 所有写操作经单一写队列串行化</text>
<text x="340" y="334" font-size="11" fill="#534AB7" text-anchor="middle" dominant-baseline="central">WAL 模式支持多读单写，UI 浏览不会被后台翻译写入阻塞</text>
</svg>
